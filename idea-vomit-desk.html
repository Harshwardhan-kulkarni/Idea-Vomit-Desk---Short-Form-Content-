<title>Idea Vomit Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=JetBrains+Mono:wght@400;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..600;1,8..60,400..600&display=swap">
<style>
/* Layout: narrow rail + one working column. Ink is yours, blue pencil is the editor's. Spoken words are set in serif, data in mono. */
:root{
  --bg:#ECEEF3; --surface:#F8F9FC; --raised:#FFFFFF; --ink:#14172A; --muted:#565B73; --line:#D3D7E3; --line2:#BFC5D6;
  --pencil:#2346D6; --pencil-soft:#E3E8FF; --marker:#FFE27A; --cut:#C7372B; --cut-soft:#FBE4E1; --ok:#1B7F45; --ok-soft:#DDF2E5; --warn:#8A5A00; --warn-soft:#FBEFCF;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif; --ui:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --say:"Source Serif 4",Georgia,"Times New Roman",serif; --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F111A; --surface:#161927; --raised:#1D2132; --ink:#E9EBF5; --muted:#9A9FB8; --line:#2A2F45; --line2:#3A4060;
  --pencil:#94A9FF; --pencil-soft:#1D2548; --marker:#6B5A12; --cut:#FF8576; --cut-soft:#3A1D1A; --ok:#63D694; --ok-soft:#153324; --warn:#F0C25A; --warn-soft:#362B0E; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0F111A; --surface:#161927; --raised:#1D2132; --ink:#E9EBF5; --muted:#9A9FB8; --line:#2A2F45; --line2:#3A4060;
  --pencil:#94A9FF; --pencil-soft:#1D2548; --marker:#6B5A12; --cut:#FF8576; --cut-soft:#3A1D1A; --ok:#63D694; --ok-soft:#153324; --warn:#F0C25A; --warn-soft:#362B0E; color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--ui);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
button:disabled{cursor:default;opacity:.45}
:focus-visible{outline:2px solid var(--pencil);outline-offset:2px;border-radius:3px}
a{color:inherit;text-decoration-color:var(--line2);text-underline-offset:3px}
h1,h2,h3,p,ul,ol,dl,dd,figure,blockquote{margin:0}
ul,ol{padding:0;list-style:none}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:.86em;letter-spacing:-.01em}
.say{font-family:var(--say);font-size:17px;line-height:1.42}
.say.xl{font-size:22px;line-height:1.32}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.tiny{font-size:12.5px;color:var(--muted);line-height:1.45}
.dim{color:var(--muted)}
.grow{flex:1;min-width:0}
.clip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.lab{display:block;font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.lede{color:var(--muted);max-width:66ch}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.stack.lg{gap:26px}.stack.sm{gap:8px}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.row.wrap,.wrap{flex-wrap:wrap}.row.between{justify-content:space-between}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:14px}
.five{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px}
.scrollx{overflow-x:auto}

/* shell */
.app{display:grid;grid-template-columns:212px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;display:flex;flex-direction:column;gap:22px;padding:22px 14px;border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--display);font-stretch:118%;font-weight:800;font-size:15px;letter-spacing:.02em;text-transform:uppercase;padding:0 8px}
.logo{width:11px;height:20px;border:2px solid var(--ink);border-radius:2px;position:relative}
.logo::after{content:"";position:absolute;left:1px;right:1px;top:2px;height:3px;background:var(--pencil)}
.rail nav{display:flex;flex-direction:column;gap:2px}
.rail nav button,.railbtn{display:flex;align-items:center;gap:11px;padding:8px 9px;border-radius:var(--r);font-weight:500;color:var(--muted);width:100%}
.rail nav button:hover,.railbtn:hover{background:var(--surface);color:var(--ink)}
.rail nav button[aria-current]{background:var(--ink);color:var(--bg)}
.rail nav em{margin-left:auto;font-style:normal;opacity:.7}
.railfoot{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.railbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.syncline{display:flex;gap:7px;align-items:flex-start;font-size:12px;color:var(--muted);padding:0 9px;line-height:1.35}
.syncline svg{flex:none;margin-top:1px}
.syncline.synced{color:var(--ok)}.syncline.error{color:var(--cut)}
.topbar{display:none}
main{padding-block:34px 80px;padding-inline:clamp(16px,4vw,44px);max-width:900px;width:100%;min-width:0}
@media (max-width:760px){
  .app{display:block}
  .rail{position:fixed;inset:auto 0 0 0;height:auto;top:auto;flex-direction:row;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line);background:var(--bg);z-index:20}
  .rail .brand,.railfoot{display:none}
  .rail nav{flex-direction:row;width:100%;justify-content:space-around}
  .rail nav button{flex-direction:column;gap:2px;font-size:11px;padding:6px 4px;width:auto;flex:1;align-items:center}
  .rail nav button[aria-current]{background:none;color:var(--ink);font-weight:700}
  .rail nav button[aria-current] svg{color:var(--pencil)}
  .rail nav em{display:none}
  .topbar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
  .topbar .brand{padding:0;flex:1}
  main{padding-block:20px 110px}
}

/* type */
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.eyebrow{color:var(--muted);margin-bottom:4px}
h1{font-family:var(--display);font-stretch:122%;font-weight:800;font-size:clamp(26px,4.6vw,34px);line-height:1.05;letter-spacing:-.015em;text-wrap:balance}
h2{font-size:17px;font-weight:700;text-wrap:balance}
h3{font-size:15px;font-weight:700}
.grouphead{display:flex;gap:8px;align-items:baseline;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:6px}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 14px;border:1px solid var(--line2);border-radius:var(--r);background:var(--raised);font-weight:600;font-size:14px;line-height:1.2;text-decoration:none;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--ink)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.ink{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.pencil{background:var(--pencil);color:var(--raised);border-color:var(--pencil)}
:root[data-theme="dark"] .btn.pencil{color:#0F111A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.pencil{color:#0F111A}}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover:not(:disabled){color:var(--ink);border-color:var(--line2)}
.btn.danger,.link.danger{color:var(--cut)}
.btn.dangerfill{background:var(--cut);border-color:var(--cut);color:var(--raised)}
.btn.right{border-color:var(--ok);background:var(--ok-soft);opacity:1}.btn.wrong{border-color:var(--cut);background:var(--cut-soft);opacity:1}
.link{color:var(--ink);text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px;font-size:13.5px;display:inline-flex;align-items:center;gap:4px}
.link:hover{text-decoration-color:var(--ink)}
.iconbtn{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:var(--r);color:var(--muted)}
.iconbtn:hover{background:var(--surface);color:var(--ink)}
.input,.dump,.auto{width:100%;min-width:0}
.input{padding:9px 11px;border:1px solid var(--line2);border-radius:var(--r);background:var(--raised);line-height:1.45}
.input:focus,.dump:focus{outline:2px solid var(--pencil);outline-offset:-1px;border-color:var(--pencil)}
.input.big{font-size:16px;line-height:1.55;padding:13px 14px}
textarea.auto{resize:none;overflow:hidden;display:block}
select.input{appearance:auto}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field .lab{margin:0;text-transform:none;letter-spacing:0;font-size:13.5px;color:var(--ink)}
.field .lab em{display:block;font-style:normal;font-weight:400;color:var(--muted);font-size:12.5px;margin-top:1px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:var(--r);padding:2px;gap:2px;background:var(--surface);align-self:flex-start;max-width:100%}
.seg.wrap{flex-wrap:wrap}
.seg button{padding:6px 12px;border-radius:4px;font-weight:600;font-size:13.5px;color:var(--muted);white-space:nowrap}
.seg.sm button{padding:4px 10px;font-size:13px}
.seg button[aria-selected="true"],.seg button[aria-checked="true"]{background:var(--ink);color:var(--bg)}
.seg button .mono{opacity:.65}
.tier{display:inline-flex;border:1px dashed var(--pencil);border-radius:var(--r);padding:2px;gap:1px}
.tier button{padding:3px 9px;font-size:12px;font-weight:600;border-radius:4px;color:var(--pencil)}
.tier button[aria-checked="true"]{background:var(--pencil-soft)}
.runbar{display:flex;flex-direction:column;gap:7px;min-width:0}
.runrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.status{font-size:13px;color:var(--muted);display:flex;gap:8px;align-items:center}
.status.err{color:var(--cut)}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--pencil);animation:pulse 1.1s ease-in-out infinite;flex:none}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border:1px solid var(--line2);border-radius:99px;font-size:12px;font-weight:600;color:var(--muted);text-transform:capitalize}
.chip.ok{border-color:var(--ok);color:var(--ok);background:var(--ok-soft)}.chip.warn{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}.chip.cut{border-color:var(--cut);color:var(--cut);background:var(--cut-soft)}
.empty{border:1px dashed var(--line2);border-radius:var(--r);padding:22px;color:var(--muted);max-width:66ch}
.empty b{color:var(--ink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.warnbox{background:var(--warn-soft);color:var(--ink);border-left:3px solid var(--warn);padding:10px 14px;font-size:14px;max-width:70ch}
details>summary{cursor:pointer;font-weight:600;font-size:13.5px;color:var(--muted)}
details[open]>summary{margin-bottom:8px}
ul.plain{list-style:disc;padding-left:18px;display:flex;flex-direction:column;gap:5px}
.pre{white-space:pre-wrap;font-size:14px;color:var(--muted)}

/* your words */
.yours{position:relative;background:linear-gradient(transparent 0 0) no-repeat;border-left:3px solid var(--marker);padding:6px 0 6px 14px;font-family:var(--say);font-size:17px;line-height:1.45}
.yours.block{font-family:var(--ui);font-size:14.5px}
.yours .tag,.src{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;padding:1px 6px;border-radius:3px;background:var(--marker);color:var(--ink);margin-right:8px;vertical-align:2px}
.src.added{background:var(--pencil-soft);color:var(--pencil)}
.src.edit{background:none;border:1px solid var(--line2);color:var(--muted)}
.src.his{background:none;border:1px solid var(--line2);color:var(--muted)}
.pencilink{color:var(--pencil)}

/* desk */
.streak{display:flex;gap:12px;align-items:center}
.streak .big{font-size:30px;font-weight:600;line-height:1}
.dots{display:flex;gap:4px;margin-bottom:3px}
.dots i{width:14px;height:6px;border-radius:2px;background:var(--line)}
.dots i.on{background:var(--ink)}
.starters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.starters button{flex:none;font-size:12.5px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:4px 11px;white-space:nowrap}
.starters button:hover{color:var(--ink);border-color:var(--line2)}
.dump{border:1px solid var(--line2);border-radius:var(--r);background:var(--raised);padding:16px 18px;font-size:16.5px;line-height:1.65;min-height:170px;
  background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 27.2px;background-position:0 15px;background-attachment:local}
.resulthead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:2px solid var(--ink);padding-top:12px}
.dumped p{white-space:pre-wrap;color:var(--muted);font-size:14.5px;max-width:70ch}
.read{font-size:17px;line-height:1.5;max-width:64ch;font-weight:500}
.idea{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:18px;display:flex;flex-direction:column;gap:13px;min-width:0}
.idea header{display:flex;gap:12px;align-items:flex-start}
.idea .idx{font-size:13px;color:var(--pencil);padding-top:4px}
.idea h3{font-size:19px;line-height:1.25;margin-bottom:7px;text-wrap:balance}
.idea .why{color:var(--muted);font-size:14.5px}
.idea footer{display:flex;justify-content:flex-end;border-top:1px solid var(--line);padding-top:13px}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:7px 16px;font-size:14.5px}
.kv dt{color:var(--muted);font-size:12.5px;padding-top:2px}
.kv.sm{font-size:13.5px;gap:3px 12px}
.kv dd.miss{color:var(--cut)}
.kv .sub,.panel .sub{display:block;color:var(--muted);font-size:13px}
@media (max-width:520px){.kv{grid-template-columns:1fr;gap:1px 0}.kv dt{padding-top:8px}}
.need ul{list-style:none;display:flex;flex-direction:column;gap:4px}
.need li{padding-left:18px;position:relative;font-size:14.5px}
.need li::before{content:"?";position:absolute;left:0;font-family:var(--mono);color:var(--pencil);font-weight:600}
.shapes{display:flex;flex-direction:column;gap:8px}
.shape{border:1px dashed var(--pencil);border-radius:var(--r);padding:11px 13px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.shape .say{color:var(--pencil);grid-column:1}.shape .tiny{grid-column:1}
.shape .btn{grid-column:2;grid-row:1/span 2}
@media (max-width:520px){.shape{grid-template-columns:1fr}.shape .btn{grid-column:1;grid-row:auto;justify-self:start}}
.dropped li{font-size:14px;color:var(--muted);margin-bottom:4px}.dropped b{color:var(--ink);font-weight:600}
.rows{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.rows>li+li{border-top:1px solid var(--line)}
.rowbtn{display:flex;gap:14px;align-items:center;width:100%;padding:11px 14px;min-width:0}
.rowbtn:hover,.rowbtn.cur{background:var(--raised)}
.rowbtn .tiny{display:block}
.drawn{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border:1px solid var(--ink);border-radius:var(--r);padding:12px 14px;font-size:17px}
.grid65{display:grid;grid-template-columns:150px repeat(5,minmax(104px,1fr));gap:4px;min-width:700px}
.grid65 input{border:1px solid transparent;background:none;padding:6px;font-size:12.5px;font-weight:600;border-radius:4px;min-width:0}
.grid65 input:hover{border-color:var(--line2)}
.cell{min-height:44px;border:1px solid var(--line);border-radius:4px;background:var(--surface);display:grid;place-items:center}
.cell.done{background:var(--ink);color:var(--bg);border-color:var(--ink)}.cell.pick{outline:2px solid var(--pencil);outline-offset:1px}

/* pieces */
.rowbtn.piece{display:grid;grid-template-columns:minmax(0,1fr);gap:3px;padding:13px 16px}
.ptitle{font-weight:700;font-size:15.5px}
.rowbtn.piece .say{color:var(--muted);font-size:15px}
.pmeta{display:flex;gap:12px;align-items:center;flex-wrap:wrap;color:var(--muted);margin-top:3px}
.track{display:inline-flex;gap:3px}
.track i{width:16px;height:5px;border-radius:2px;background:var(--line2)}.track i.on{background:var(--pencil)}
.backlink{align-self:flex-start;color:var(--muted)}
.title{font-family:var(--display);font-stretch:118%;font-weight:800;font-size:clamp(22px,4vw,28px);line-height:1.15;border:0;background:none;padding:0;letter-spacing:-.01em}
.title:focus{outline:none;box-shadow:0 2px 0 var(--pencil)}
.stages{display:flex;border-bottom:1px solid var(--line2);gap:2px;overflow-x:auto;scrollbar-width:none}
.stages button{display:flex;gap:8px;align-items:center;padding:9px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.stages button .mono{display:inline-grid;place-items:center;width:19px;height:19px;border:1px solid var(--line2);border-radius:50%;font-size:10.5px}
.stages button.done .mono{background:var(--pencil);border-color:var(--pencil);color:var(--raised)}
.stages button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.locked{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--ink);border-radius:var(--r);padding:11px 15px}
.hookbench{display:flex;gap:22px;align-items:flex-start}
.frame{flex:none;width:132px;display:flex;flex-direction:column;gap:6px;align-items:center}
.screen{width:100%;aspect-ratio:9/16;border-radius:12px;background:#171A2B;color:#F2F3F8;position:relative;overflow:hidden;display:flex;flex-direction:column;padding:12px 10px;border:1px solid var(--line2)}
.screen .rec{position:absolute;top:8px;right:9px;font-size:9.5px;opacity:.6}
.screen .rec::before{content:"";display:inline-block;width:5px;height:5px;border-radius:50%;background:#FF5A4D;margin-right:4px;vertical-align:1px}
.screen .ft{margin-top:26%;font-weight:800;font-size:13.5px;line-height:1.15;text-align:center;overflow-wrap:anywhere}
.screen .fv{margin-top:auto;font-size:9.5px;line-height:1.3;opacity:.62;text-align:center;overflow-wrap:anywhere}
@media (max-width:620px){.hookbench{flex-direction:column}.frame{width:118px;align-self:center}}
.lint{display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.lint li{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.lint li i{width:7px;height:7px;border-radius:50%;flex:none;transform:translateY(-1px)}
.lint li.ok i{background:var(--ok)}.lint li.no i{background:var(--cut)}
.lint li span{color:var(--muted)}
.grade{display:flex;flex-direction:column;gap:16px;border-top:2px solid var(--ink);padding-top:16px}
.attempts{display:flex;gap:5px;flex-wrap:wrap}
.attempts button{display:flex;flex-direction:column;align-items:center;min-width:46px;padding:4px 8px;border:1px solid var(--line2);border-radius:var(--r);font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.attempts button .mono{font-size:15px;color:var(--ink);font-weight:600}
.attempts button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.attempts button[aria-selected="true"] .mono{color:var(--bg)}
.slate{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}
.score{display:flex;flex-direction:column;align-items:flex-start;gap:2px;flex:none}
.score .n{font-size:56px;line-height:.9;font-weight:600;letter-spacing:-.04em}
.score .of{color:var(--muted);margin-bottom:6px}
mark{background:none;color:inherit;text-decoration:underline wavy var(--pencil);text-decoration-thickness:1.5px;text-underline-offset:4px}
mark sup{font-family:var(--mono);font-size:10px;color:var(--pencil);margin-left:1px}
.marknotes{list-style:decimal;padding-left:20px;font-size:13.5px;color:var(--pencil);margin-top:6px}
.crit{width:100%;border-collapse:collapse;font-size:14px}
.crit tr{border-top:1px solid var(--line)}
.crit th{text-align:left;font-weight:600;padding:9px 14px 9px 0;width:34%;vertical-align:top}
.crit th span{display:block;font-weight:400;color:var(--muted);font-size:12px;line-height:1.35}
.crit td{padding:9px 0;vertical-align:top}
.pips{white-space:nowrap;width:52px;padding-top:14px !important}
.pips i{display:inline-block;width:16px;height:8px;border:1px solid var(--line2);border-radius:2px;margin-right:3px}
.pips i.on{background:var(--ink);border-color:var(--ink)}
@media (max-width:560px){.crit th{width:auto;display:block;padding-bottom:2px}.crit tr{display:grid;grid-template-columns:52px minmax(0,1fr);gap:0 8px;padding:8px 0}.crit th{grid-column:1/-1}.crit td{padding:2px 0}.pips{padding-top:6px !important}}
.fix,.askyou{font-size:15.5px;max-width:68ch}
.askyou{color:var(--pencil)}
.edits{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}
.edit{border:1px dashed var(--pencil);border-radius:var(--r);padding:13px;display:flex;flex-direction:column;gap:9px;min-width:0}
.edit .move{color:var(--pencil);text-transform:uppercase;font-size:10.5px;letter-spacing:.06em}
.edit .row{margin-top:auto;flex-wrap:wrap}

/* script */
.starts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}
.start{border:1px solid var(--line2);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:4px;background:var(--surface)}
.start span{font-size:13px;color:var(--muted);line-height:1.4}
.start.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink);background:var(--raised)}
.vers{display:inline-flex;gap:3px}
.vers button{font-family:var(--mono);font-size:12px;padding:3px 8px;border:1px solid var(--line2);border-radius:4px;color:var(--muted)}
.vers button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.beats{display:flex;flex-direction:column}
.beat{display:grid;grid-template-columns:86px minmax(0,1fr);gap:0 16px;padding:13px 0;border-top:1px solid var(--line)}
.beat .gutter{display:flex;flex-direction:column;gap:2px;padding-top:4px}
.beat .gutter .mono{font-size:13px;font-weight:600}
.bname{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);line-height:1.3}
.beat .line{border:0;background:none;padding:2px 0;font-size:18px;line-height:1.45}
.beat .line:focus{outline:none;box-shadow:0 1px 0 var(--pencil)}
.beat.added .line{color:var(--pencil)}
.beat.added .gutter{border-left:2px solid var(--pencil);padding-left:8px;margin-left:-10px}
.beat .meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--muted);margin-top:5px;align-items:center}
.beat .meta b{font-weight:600;color:var(--ink);font-size:11px;letter-spacing:.05em;text-transform:uppercase;margin-right:3px}
.beat .meta .src{margin:0}
.beatact{display:flex;gap:14px;margin-top:6px;flex-wrap:wrap}
.beatact .link{font-size:12.5px;color:var(--muted)}
.rework{margin-top:10px;padding:12px;border:1px dashed var(--pencil);border-radius:var(--r);display:flex;flex-direction:column;gap:9px}
@media (max-width:560px){.beat{grid-template-columns:1fr}.beat .gutter{flex-direction:row;gap:10px;align-items:baseline;padding:0 0 2px}.beat.added .gutter{margin-left:0}}
.readview{background:var(--raised);border:1px solid var(--line);border-radius:var(--r);padding:clamp(18px,4vw,34px);display:flex;flex-direction:column;gap:16px}
.readline{font-size:clamp(20px,3.4vw,26px);line-height:1.38;max-width:30ch}
.notes{border-left:3px solid var(--line2);padding-left:14px;display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--muted);max-width:70ch}
.capbox{border:1px solid var(--line2);border-radius:var(--r);background:var(--raised);overflow:hidden}
.capbox header{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.captext{border:0;background:none;padding:14px 16px 8px;font-size:15.5px;line-height:1.6}
.captags{border:0;background:none;padding:0 16px 12px;color:var(--muted)}
.captext:focus,.captags:focus{outline:none}
.capbox .note{padding:8px 16px;border-top:1px solid var(--line);background:var(--surface)}
.checkrow{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:1px solid var(--line2);border-radius:var(--r);background:var(--surface);cursor:pointer}
.checkrow input{width:18px;height:18px;margin-top:2px;accent-color:var(--pencil)}
.checkrow em{display:block;font-style:normal;color:var(--muted);font-size:13px}

/* library */
.search{max-width:260px}
.filters{display:flex;gap:5px;flex-wrap:wrap}
.filters button{font-size:12.5px;padding:3px 10px;border:1px solid var(--line);border-radius:99px;color:var(--muted)}
.filters button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);font-weight:600}
.rowbtn .say{display:block}
.rank{width:30px;color:var(--muted);flex:none}
.bar{display:block;height:5px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--muted);border-radius:3px}
.bar i.restart{background:var(--pencil)}
.vnum{text-align:right;flex:none;font-size:14px;font-weight:600}
.vnum em,.er em{display:block;font-style:normal;font-weight:400;color:var(--muted);font-size:11px}
.er{width:52px;flex:none;font-size:15px;font-weight:600;color:var(--pencil)}
.reelopen{padding:4px 14px 14px 58px;display:flex;flex-direction:column;gap:8px}
.reelopen .say{font-size:15px;color:var(--muted)}
@media (max-width:520px){.reelopen{padding-left:14px}}

/* review */
.base{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.base>div{background:var(--surface);padding:14px 16px;min-width:0}
.base .n{display:block;font-size:26px;font-weight:600;letter-spacing:-.03em}
.base .lab{margin:2px 0 0;text-transform:none;letter-spacing:0;font-weight:400;font-size:12.5px}
.log{width:100%;border-collapse:collapse;font-size:13.5px;min-width:620px}
.log th{text-align:left;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:6px 10px;border-bottom:1px solid var(--line2)}
.log td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.log .say{font-size:15px;min-width:220px}
.log .r{text-align:right}.log .up{color:var(--ok);font-weight:600}.log .dn{color:var(--cut)}
.reviewtext{white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--pencil);border-radius:var(--r);padding:16px 18px;font-size:15px;line-height:1.6;max-width:74ch}

/* playbook */
.card .rowbtn{align-items:flex-start}
.tick{width:20px;height:20px;border:1.5px solid var(--line2);border-radius:50%;display:grid;place-items:center;font-size:11px;flex:none;margin-top:1px}
.tick.on{background:var(--pencil);border-color:var(--pencil);color:var(--raised)}
.cardbody{padding:2px 16px 18px 48px;font-size:14.5px;max-width:74ch}
@media (max-width:520px){.cardbody{padding-left:16px}}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(10,12,24,.5);z-index:50;display:flex;justify-content:flex-end}
.sheet{width:min(440px,100%);background:var(--bg);height:100%;display:flex;flex-direction:column;border-left:1px solid var(--line2);padding-top:env(safe-area-inset-top,0px)}
.sheet.wide{width:min(560px,100%)}
.sheet header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.sheetbody{padding:20px;overflow-y:auto;flex:1;padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
.tierlist{display:flex;flex-direction:column;gap:6px}
.tierlist button{display:flex;flex-direction:column;gap:1px;padding:10px 13px;border:1px solid var(--line2);border-radius:var(--r);background:var(--surface)}
.tierlist button span{font-size:13px;color:var(--muted)}
.tierlist button[aria-checked="true"]{border-color:var(--pencil);box-shadow:inset 0 0 0 1px var(--pencil)}
.chip button{display:inline-grid;color:var(--muted)}

/* x */
.xposts{display:flex;flex-direction:column;gap:10px}
.xpost{border:1px solid var(--line2);border-radius:var(--r);background:var(--raised);overflow:hidden}
.xpost header{display:flex;gap:12px;align-items:center;padding:7px 12px;border-bottom:1px solid var(--line);color:var(--muted)}
.xpost header .mono:first-child{color:var(--pencil);font-weight:600;margin-right:auto}
.xpost .over{color:var(--cut);font-weight:600}
.xpost .captext{padding-bottom:14px}
.lint.pad{padding:10px 16px;border-top:1px solid var(--line);background:var(--surface)}
.xfact{padding-left:16px}
.card .rowbtn .chip{flex:none;text-transform:none}
.moves{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.moves li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:0 10px;padding:13px 0;border-bottom:1px solid var(--line)}
.moves li .mono{color:var(--pencil);padding-top:2px}
.moves li p{color:var(--muted);font-size:14.5px;max-width:70ch;margin-top:2px}
@media (max-width:760px){.rail nav button{font-size:10.5px;padding:6px 2px}}

/* taste + voice setup */
.taste{display:inline-flex;gap:4px;align-items:center;flex-wrap:wrap}
.taste button{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--muted);border:1px solid var(--line2);border-radius:99px;padding:2px 9px;background:var(--raised)}
.taste button:hover{color:var(--ink);border-color:var(--ink)}
.taste button[aria-pressed="true"]:first-child{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.taste button[aria-pressed="true"]:last-child{background:var(--cut-soft);border-color:var(--cut);color:var(--cut)}
.shapeact{display:flex;gap:8px;align-items:center;flex-wrap:wrap;grid-column:2;grid-row:1/span 2;justify-content:flex-end}
.shape .btn{grid-column:auto;grid-row:auto}
@media (max-width:520px){.shapeact{grid-column:1;grid-row:auto;justify-content:flex-start}}
.setupnote{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px solid var(--pencil);background:var(--pencil-soft);border-radius:var(--r);padding:12px 16px}
.setupnote p{max-width:60ch}
.steps{display:flex;flex-direction:column}
.steps>li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:0 10px;padding:18px 0;border-top:1px solid var(--line)}
.steps>li>.mono{color:var(--pencil);font-weight:600;padding-top:1px}
@media (max-width:520px){.steps>li{grid-template-columns:1fr}.steps>li>.mono{margin-bottom:4px}}
.askbox{border:1px dashed var(--line2);border-radius:var(--r);background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.askbox pre{margin:0;white-space:pre-wrap;font-family:var(--mono);font-size:12.5px;line-height:1.55;color:var(--ink)}
.warntext{color:var(--warn)}
.tastelist{display:flex;flex-direction:column;gap:2px}
.tastelist li{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--line)}
.tastelist li .say{font-size:15px}
.credit{font-size:12px;color:var(--muted);padding:0 9px;text-decoration:underline;text-decoration-color:var(--line2)}
.plainlink{font-family:inherit;font-size:inherit;text-align:left;text-decoration:none}
label.btn{cursor:pointer}
.src,.yours .tag{white-space:nowrap;line-height:1.5}
.beat .meta .src{padding:1px 6px}

h ones point at it and which are just topics you like?"},{id:"notniche",mod:"Ideas",t:"You are not the niche",who:"Kallaway",src:"Email \xB7 09-06-2026",idea:["Before ~2021 people followed a person and stayed for topics. Now they follow a topic and stay for the person.","Cake = topic consistency. Icing = one differentiator (visual packaging, originality, usefulness, a rare combo, or aura). Sprinkles = personality."],d:"For your next dump, answer before you hit the button: what does a stranger get from this?"},{id:"6x5",mod:"Ideas",t:"The 6\xD75 grid",who:"Kallaway",src:"Email \xB7 13-07-2026",idea:["6 subtopics your viewer has questions about \xD7 5 formats = 30 posts.","Nothing to decide on posting day, so no analysis paralysis."],d:"Write 6 subtopics your viewer has questions about and 5 formats you can film. If you can't name 6, your umbrella isn't clear yet."},{id:"attention",mod:"Ideas",t:"Topics that grab attention",who:"Alex Hormozi",src:"$100M Leads",idea:["Content grabs attention when it touches something recent, relevant to the viewer, unusual, tied to a known name, full of conflict, or part of an ongoing story.","Stack two and it gets stronger."],d:"Tag your last dump's best idea with which of the six it hits. If it's zero, it's a diary entry."},{id:"ladder",mod:"Hooks",t:"The Dopamine Ladder",who:"Kallaway",src:"Email \xB7 16-07-2026",idea:["1 Stimulation: something to look at in the first 2 seconds, before words land.","2 Captivation: a specific question now sits in their head.","3 Anticipation: they start guessing the answer while you feed clues.","4 Validation: the answer isn't what they guessed. If it's obvious, nothing fires.","5 and 6 (they like you, then your face alone stops them) come after months of nailing 1\u20134."],d:"Take your last idea and write what the viewer is betting on at step 3. If you can't, rewrite that step."},{id:"hookpoint",mod:"Hooks",t:"The 3-second 'wait, what?'",who:"Brendan Kane",src:"Hook Point (book)",idea:["You have about three seconds. A hook point should make someone think 'wait, what?'","Specific beats vague: 'zero to a million followers in 30 days' is a hook, 'growing on social' isn't.","Netflix's early hook was 'no late fees': one line aimed at one pain."],d:"Take your last hook. Replace every vague noun with a number or an object."},{id:"rare",mod:"Hooks",t:"The 'rare type of person' share",who:"Kallaway (Nate Gaffney breakdown)",src:"Email \xB7 23-09-2026",idea:["Everyone wants to be told they're rare. 'There is a rare type of person who\u2026' makes the viewer check if it's them, or think of a friend.","Add a 'but': hooks with a contrast hit 10x their average about three times as often in Nate's data.","Then write the exact message to send: 'send this to them and just say, hey, you're great.' It removes the effort of sharing."],d:"Write one 'rare type of person who ___, but ___' line from your own life. Mark it up on the Hook step."},{id:"shape",mod:"Hooks",t:"Shape + subject + power words",who:"Kallaway",src:"Email \xB7 06-08-2026",idea:["Copying a hook word for word breaks when your subject doesn't fit the grammar.","Keep the proven shape, bank power phrases ('addicted', 'impossible to skip'), swap until it reads right."],d:"Pick 3 hooks from HOOKS.md and rewrite each about one idea from today, in your own words."},{id:"novelty",mod:"Hooks",t:"Illusion of novelty",who:"Kallaway",src:"Email \xB7 08-09-2026",idea:["New reveal: something changed about an old thing.","Contrast: put it against what they already believe.","Urgency: it just happened.","Proof: a receipt."],d:"Pick your most boring topic and write all four lines."},{id:"but",mod:"Story",t:"But / therefore, never 'and then'",who:"Trey Parker & Matt Stone (South Park)",src:"NYU storytelling class",idea:["Write your beats in a list. If 'and then' fits between two beats, the story is boring.","Every beat should connect with 'but' (a complication) or 'therefore' (a consequence). They literally write the words in to check."],d:"Write your next script's beats as a list and put 'but' or 'therefore' between each. Cut any beat that only takes 'and then'."},{id:"5sec",mod:"Story",t:"The 5-second moment, start at the opposite",who:"Matthew Dicks",src:"Storyworthy",idea:["Every good story is about one five-second moment of change.","Start the story at the opposite of that moment so there's somewhere to travel."],d:"For today's idea, write the five-second moment, then its opposite as line one."},{id:"hrr",mod:"Story",t:"Hook, retain, reward",who:"Alex Hormozi",src:"$100M Leads",idea:["Hook gives a reason to watch. Retain keeps it easy to keep watching. Reward pays off what the hook promised.","Most videos fail on reward: the promise was bigger than the payoff."],d:"Write your hook's promise and your ending's payoff side by side. Does the payoff match?"},{id:"arc",mod:"Story",t:"Stack peaks, don't build to one",who:"Kallaway + MrBeast",src:"Email 23-07-2026 \xB7 MrBeast production memo",idea:["Drop in mid-story. Spike in the first 5\u201315 seconds, then another small peak every ~10 seconds.","MrBeast calls the long-form version 'crazy progression': cover a lot of ground early instead of telling day 1 slowly."],d:"Mark every 10-second point in your next script. What's the new thing the viewer gets at each?"},{id:"mute",mod:"Filming",t:"Text > visual > spoken",who:"Kallaway",src:"Visual hooks email \xB7 04-11-2024",idea:["Viewers read and see faster than they hear, and many watch on mute.","So the first-frame text matters most, then what's on screen, then what you say."],d:"Watch your last reel on mute. Do you understand it in 3 seconds?"},{id:"wow",mod:"Filming",t:"The wow factor",who:"MrBeast",src:"Production memo",idea:["Do one thing in the video no other creator would bother doing.","It's not about budget. It's about a moment that makes it clearly yours."],d:"For your next video, name the one shot only you would film."},{id:"physical",mod:"Filming",t:"Physical visuals as proof",who:"Kallaway (Gannon Meyer)",src:"Email \xB7 18-06-2026",idea:["Gannon's best posts use printed screenshots marked with a pen, whiteboards and props.","You see the thing he's talking about, which works as proof before he says it."],d:"Film one teardown with paper and a marker. No edits beyond cuts."},{id:"views",mod:"Growth & money",t:"Views \u2260 dollars",who:"Kallaway",src:"Email \xB7 04-06-2026",idea:["Money = traffic + funnels + offers. Three separate skills.","Every video gets a trackable CTA (comment a word \u2192 DM a free thing).","Judge topics by conversions per video. His #3 video by views was #1 for sign-ups."],d:"Pick your free thing today and add the CTA to your next 5 posts."},{id:"split",mod:"Growth & money",t:"Expertise vs personality split",who:"Kallaway",src:"Email \xB7 09-07-2026",idea:["Services ~75/25 expertise. Info products & coaching ~65/35. Consumer products ~10/90.","Work backwards from what you'll sell."],d:"Tag your last 10 posts E or P. What's the real ratio?"},{id:"batch",mod:"Growth & money",t:"10x batch",who:"Kallaway",src:"Email \xB7 12-06-2026",idea:["Post 10, then split winners vs losers on topic, framing, hook and structure.","Carry the pattern into the next 10."],d:"Log every reel in My reels the day after, even the bad ones."}],quiz:[]},reels:[],outliers:[],bank:[],voice:{captions:[],recent:[],spoken:[]}};var ze=t=>{let s=t.filter(o=>typeof o=="number"&&!isNaN(o)&&o>0).sort((o,n)=>o-n);return s.length?s[Math.floor(s.length/2)]:0},te=t=>String(t||"").trim().match(/[A-Za-z0-9$₹%'’]+/g)||[],Do=(ve.reels||[]).slice().sort((t,s)=>s.views-t.views).map((t,s)=>({...t,rid:"R"+(s+1)}));function se(){return Object.values(Q().posts||{}).filter(s=>(s.hook||"").trim()).sort((s,o)=>(o.views||0)-(s.views||0)).map((s,o)=>{let n=(+s.likes||0)+(+s.comments||0)+(+s.shares||0)+(+s.saves||0);return{rid:"R"+(o+1),id:s.id,views:+s.views||0,likes:+s.likes||0,comments:+s.comments||0,er:s.views?Math.round(n/s.views*1e3)/10:0,hook:s.hook,spoken:!0,url:s.url||"
